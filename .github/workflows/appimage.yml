name: AppImage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GTK4 AppDir build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            desktop-file-utils \
            gir1.2-gtk-4.0 \
            libglib2.0-bin \
            libgtk-4-dev \
            python3-gi

      - name: Run source tests
        run: /usr/bin/python3 scan_bugs.py

      - name: Build and smoke-test AppImage
        run: bash scripts/build-appimage.sh

      - name: Upload tested AppImage
        uses: actions/upload-artifact@v4
        with:
          name: xlauncher-appimage-x86_64
          path: |
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
